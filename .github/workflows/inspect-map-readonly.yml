name: Inspect map structure (read only)

on:
  push:
    branches:
      - inspect/mapa-solo-lectura

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install pinned Lune
        run: cargo install lune --version 0.11.0 --locked

      - name: Inspect map without modifying it
        run: lune run scripts/inspect-map.luau

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: mapa-inspeccion-solo-lectura
          path: inspection/map-structure.txt
          if-no-files-found: error
          retention-days: 7
