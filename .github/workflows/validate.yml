name: Validate Rojo project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Rojo CLI
        run: cargo install rojo --version 7.7.1 --locked

      - name: Validate project JSON
        run: python -m json.tool default.project.json > /dev/null

      - name: Build project tree
        run: rojo build default.project.json --output /tmp/BravoSixSierraMexico.rbxlx

      - name: Check generated place file
        run: test -s /tmp/BravoSixSierraMexico.rbxlx
