name: Validate Rojo project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install pinned Rojo and Lune
        run: |
          cargo install rojo --version 7.7.1 --locked
          cargo install lune --version 0.11.0 --locked

      - name: Validate project JSON
        run: python -m json.tool default.project.json > /dev/null

      - name: Build project tree
        run: |
          mkdir -p build
          rojo build default.project.json --output build/BravoSix-src.rbxlx

      - name: Check generated source place
        run: test -s build/BravoSix-src.rbxlx

      - name: Merge code into original map (no publishing)
        run: |
          lune run scripts/merge-place.luau
          test -s BravoSix-merged.rbxl

      - name: Upload merged map validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: BravoSix-merged-place-validation
          path: BravoSix-merged.rbxl
          if-no-files-found: error
          retention-days: 14
